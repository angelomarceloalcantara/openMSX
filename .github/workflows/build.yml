name: Build openMSX MSX2++

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # Raspberry Pi Zero - ARMv6 / ARMHF
  # ============================================================
  build-armhf:
    runs-on: ubuntu-24.04

    env:
      OPENMSX_TARGET_CPU: arm
      OPENMSX_TARGET_OS: linux
      OPENMSX_FLAVOUR: opt

      # Cross compiler
      CC: arm-linux-gnueabihf-gcc
      CXX: arm-linux-gnueabihf-g++

      # Raspberry Pi Zero / ARMv6
      CFLAGS: >-
        -march=armv6
        -marm
        -mfpu=vfp
        -mfloat-abi=hard
        -DGLEW_NO_GLU

      CXXFLAGS: >-
        -march=armv6
        -marm
        -mfpu=vfp
        -mfloat-abi=hard
        -DGLEW_NO_GLU

    steps:

      # ----------------------------------------------------------
      # Source
      # ----------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------
      # ARM cross compiler
      # ----------------------------------------------------------
      - name: Install ARM cross compiler
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            libx11-dev \
            libgl-dev \
            make \
            python3 \
            pkg-config

      # ----------------------------------------------------------
      # Verify host/target toolchains
      # ----------------------------------------------------------
      - name: Debug ARM toolchain
        run: |
          echo "========================================"
          echo "HOST"
          echo "========================================"

          gcc -dumpmachine
          g++ -dumpmachine

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"

          arm-linux-gnueabihf-gcc -dumpmachine
          arm-linux-gnueabihf-g++ -dumpmachine

          echo
          echo "========================================"
          echo "ARM FLAGS"
          echo "========================================"

          echo | arm-linux-gnueabihf-gcc \
            -march=armv6 \
            -marm \
            -mfpu=vfp \
            -mfloat-abi=hard \
            -dM -E - | \
            grep -E '(__arm__|__ARM_ARCH|__ARM_PCS_VFP)'

          echo
          echo "========================================"
          echo "TEST ARM C"
          echo "========================================"

          cat > /tmp/test.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          arm-linux-gnueabihf-gcc \
            -march=armv6 \
            -marm \
            -mfpu=vfp \
            -mfloat-abi=hard \
            /tmp/test.c \
            -o /tmp/test-arm

          echo
          echo "Generated ARM executable:"
          file /tmp/test-arm

      # ----------------------------------------------------------
      # Configure openMSX
      # ----------------------------------------------------------
      - name: Configure ARM
        run: |
          ./configure

      # ----------------------------------------------------------
      # Show openMSX configuration
      # ----------------------------------------------------------
      - name: Show openMSX configuration
        run: |
          make -f build/main.mk config

      # ----------------------------------------------------------
      # Show relevant compiler variables
      # ----------------------------------------------------------
      - name: Show build environment
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "OPENMSX_TARGET_CPU=$OPENMSX_TARGET_CPU"
          echo "OPENMSX_TARGET_OS=$OPENMSX_TARGET_OS"
          echo "OPENMSX_FLAVOUR=$OPENMSX_FLAVOUR"

      # ----------------------------------------------------------
      # Clean
      # ----------------------------------------------------------
      - name: Clean previous 3rdparty build
        run: |
          rm -rf derived/arm-linux-opt-3rd/3rdparty

      # ----------------------------------------------------------
      # Debug 3rdparty
      # ----------------------------------------------------------
      - name: Debug 3rdparty configuration
        run: |
          echo "=== 3rdparty.mk: GLEW ==="
          grep -nEi 'glew|opengl' build/3rdparty.mk || true
          
          echo "=== files related to GLEW ==="
          find 3rdparty -type f | grep -Ei 'glew|opengl' | head -100 || true
          
          echo "=== components.py: GLEW ==="
          grep -RniEi 'glew|opengl' build/components.py build/*.py 2>/dev/null || true

      # ----------------------------------------------------------
      # Debug GLEW/OpenGL
      # ----------------------------------------------------------
      - name: Debug GLEW/OpenGL link flags
        run: |
          echo "=== LIBRARY_LINK_FLAGS ==="
          grep -R "LIBRARY_LINK_FLAGS" derived/arm-linux-opt-3rd/config 2>/dev/null || true
          
          echo "=== GLEW files ==="
          find derived/arm-linux-opt-3rd/3rdparty -iname '*glew*' -o -iname 'libGLEW*' 2>/dev/null | head -50
          
          echo "=== components_defs.mk ==="
          grep -nEi 'glew|opengl|gl' derived/arm-linux-opt-3rd/config/components_defs.mk 2>/dev/null || true

      # ----------------------------------------------------------
      # DEBUG GLEW configuration
      # ----------------------------------------------------------
      - name: DEBUG GLEW configuration
        run: |
          echo "=== build/3rdparty.mk 285-315 ==="
          nl -ba build/3rdparty.mk | sed -n '285,315p'
          
          echo "=== derived 3rdparty directories ==="
          find derived/arm-linux-opt-3rd/3rdparty -maxdepth 4 -type d -print 2>/dev/null || true
          
          echo "=== GLEW source/build/install ==="
          find derived/arm-linux-opt-3rd/3rdparty \
          -type f \
          \( -name 'libGLEW.a' -o -name 'glew.h' -o -name 'Makefile' \) \
          -print 2>/dev/null || true

      # ----------------------------------------------------------
      # Build 3rd party libraries
      # ----------------------------------------------------------
      - name: Build 3rd party libraries
        run: |
          make -f build/main.mk 3rdparty \
            OPENMSX_TARGET_CPU=arm \
            OPENMSX_TARGET_OS=linux \
            OPENMSX_FLAVOUR=opt \
            PYTHON=python3

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build static ARM distribution
        run: |
          make -j$(nproc) staticbindist

      # ----------------------------------------------------------
      # Show generated files
      # ----------------------------------------------------------
      - name: Find generated files
        run: |
          echo "Generated files:"
          find derived -type f -maxdepth 6 -print | sort

      # ----------------------------------------------------------
      # Verify ARM architecture
      # ----------------------------------------------------------
      - name: Verify ARM architecture
        run: |
          echo "ARM executables:"
          find derived -type f -executable -exec file {} \;

      # ----------------------------------------------------------
      # Upload ARM distribution
      # ----------------------------------------------------------
      - name: Upload openMSX ARM
        uses: actions/upload-artifact@v4
        with:
          name: openMSX-msx2pp-linux-armhf
          path: |
            derived/arm-linux-opt-3rd/bindist/**
          if-no-files-found: error
