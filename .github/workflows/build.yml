name: Build openMSX MSX2++

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            g++ \
            gcc \
            make \
            python3 \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libglew-dev \
            libpng-dev \
            libogg-dev \
            libtheora-dev \
            libvorbis-dev \
            tcl-dev \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Show compiler
        run: |
          gcc --version
          g++ --version
          make --version
          python3 --version

      - name: Configure
        run: |
          ./configure

      - name: Build static distribution
        run: |
          make -j$(nproc) staticbindist

      - name: Find generated files
        run: |
          echo "Generated files:"
          find derived -type f -maxdepth 6 -print | sort

      - name: Upload openMSX
        uses: actions/upload-artifact@v4
        with:
          name: openMSX-msx2pp-linux-x86_64
          path: |
            derived/**/bindist/**
          if-no-files-found: error
