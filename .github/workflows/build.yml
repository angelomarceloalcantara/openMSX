name: Build openMSX MSX2++

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # Linux x86_64
  # ============================================================
  build-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            gcc \
            make \
            python3 \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libglew-dev \
            libpng-dev \
            libogg-dev \
            libtheora-dev \
            libvorbis-dev \
            tcl-dev \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Show compiler
        run: |
          gcc --version
          g++ --version
          make --version
          python3 --version

      - name: Configure
        run: |
          ./configure

      - name: Build static distribution
        run: |
          make -j$(nproc) staticbindist

      - name: Find generated files
        run: |
          echo "Generated files:"
          find derived -type f -maxdepth 6 -print | sort

      - name: Verify architecture
        run: |
          echo "Architecture:"
          find derived -type f -executable -exec file {} \;

      - name: Upload openMSX x86_64
        uses: actions/upload-artifact@v4
        with:
          name: openMSX-msx2pp-linux-x86_64
          path: |
            derived/**/bindist/**
          if-no-files-found: error


  # ============================================================
  # Raspberry Pi Zero - ARMv6 / ARMHF
  # ============================================================
  build-armhf:
    runs-on: ubuntu-24.04

    env:
      OPENMSX_TARGET_CPU: arm
      OPENMSX_TARGET_OS: linux
      OPENMSX_FLAVOUR: opt

      # Cross compiler
      CC: arm-linux-gnueabihf-gcc
      CXX: arm-linux-gnueabihf-g++

      # Raspberry Pi Zero / ARMv6
      #
      # -march=armv6  -> ARMv6
      # -marm         -> ARM mode, não Thumb-1
      # -mfpu=vfp     -> VFP
      # -mfloat-abi=hard -> hard-float ABI
      #
      CFLAGS: >-
        -march=armv6
        -marm
        -mfpu=vfp
        -mfloat-abi=hard

      CXXFLAGS: >-
        -march=armv6
        -marm
        -mfpu=vfp
        -mfloat-abi=hard
        -DGLEW_NO_GLU
    
    steps:

      # ----------------------------------------------------------
      # Source
      # ----------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ----------------------------------------------------------
      # ARM cross compiler
      #
      # IMPORTANTE:
      # Não usar dpkg --add-architecture armhf.
      # Não instalar pacotes :armhf.
      #
      # Estamos fazendo cross-compilação.
      # ----------------------------------------------------------
      - name: Install ARM cross compiler
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            libx11-dev \
            libgl-dev \
            make \
            python3 \
            pkg-config

      # ----------------------------------------------------------
      # Verify host/target toolchains
      # ----------------------------------------------------------
      - name: Debug ARM toolchain
        run: |
          echo "========================================"
          echo "HOST"
          echo "========================================"

          gcc -dumpmachine
          g++ -dumpmachine

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"

          arm-linux-gnueabihf-gcc -dumpmachine
          arm-linux-gnueabihf-g++ -dumpmachine

          echo
          echo "========================================"
          echo "ARM FLAGS"
          echo "========================================"

          echo | arm-linux-gnueabihf-gcc \
            -march=armv6 \
            -marm \
            -mfpu=vfp \
            -mfloat-abi=hard \
            -dM -E - | \
            grep -E '(__arm__|__ARM_ARCH|__ARM_PCS_VFP)'

          echo
          echo "========================================"
          echo "TEST ARM C"
          echo "========================================"

          cat > /tmp/test.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          arm-linux-gnueabihf-gcc \
            -march=armv6 \
            -marm \
            -mfpu=vfp \
            -mfloat-abi=hard \
            /tmp/test.c \
            -o /tmp/test-arm

          echo
          echo "Generated ARM executable:"
          file /tmp/test-arm


      # ----------------------------------------------------------
      # Configure openMSX
      # ----------------------------------------------------------
      - name: Configure ARM
        run: |
          ./configure


      # ----------------------------------------------------------
      # Show openMSX configuration
      # ----------------------------------------------------------
      - name: Show openMSX configuration
        run: |
          make -f build/main.mk config


      # ----------------------------------------------------------
      # Show relevant compiler variables
      # ----------------------------------------------------------
      - name: Show build environment
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "OPENMSX_TARGET_CPU=$OPENMSX_TARGET_CPU"
          echo "OPENMSX_TARGET_OS=$OPENMSX_TARGET_OS"
          echo "OPENMSX_FLAVOUR=$OPENMSX_FLAVOUR"


      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build static ARM distribution
        run: |
          make -j$(nproc) staticbindist


      # ----------------------------------------------------------
      # Show generated files
      # ----------------------------------------------------------
      - name: Find generated files
        run: |
          echo "Generated files:"
          find derived -type f -maxdepth 6 -print | sort


      # ----------------------------------------------------------
      # Verify architecture
      # ----------------------------------------------------------
      - name: Verify ARM architecture
        run: |
          echo "ARM executables:"
          find derived -type f -executable -exec file {} \;


      # ----------------------------------------------------------
      # Upload ARM distribution
      # ----------------------------------------------------------
      - name: Upload openMSX ARM
        uses: actions/upload-artifact@v4
        with:
          name: openMSX-msx2pp-linux-armhf
          path: |
            derived/arm-linux-opt/bindist/**
          if-no-files-found: error
