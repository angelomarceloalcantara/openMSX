name: Build openMSX MSX2++

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # Raspberry Pi Zero - ARMv6 / ARMHF
  # ============================================================
  build-armhf:
    runs-on: ubuntu-24.04

    env:
      OPENMSX_TARGET_CPU: arm
      OPENMSX_TARGET_OS: linux
      OPENMSX_FLAVOUR: opt

      # Cross compiler
      CC: arm-linux-gnueabihf-gcc
      CXX: arm-linux-gnueabihf-g++

      # Raspberry Pi Zero / ARMv6
      CFLAGS: >-
        -march=armv6
        -marm
        -mfpu=vfp
        -mfloat-abi=hard
        -DGLEW_NO_GLU

      CXXFLAGS: >-
        -march=armv6
        -marm
        -mfpu=vfp
        -mfloat-abi=hard
        -DGLEW_NO_GLU

    steps:

      # ----------------------------------------------------------
      # Source
      # ----------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------
      # ARM cross compiler + OpenGL/GLEW ARMHF development files
      # ----------------------------------------------------------
      - name: Install ARM cross compiler
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            libx11-dev:armhf \
            make \
            python3 \
            pkg-config

      # ----------------------------------------------------------
      # Verify host/target toolchains
      # ----------------------------------------------------------
      - name: Debug ARM toolchain
        run: |
          echo "========================================"
          echo "HOST"
          echo "========================================"

          gcc -dumpmachine
          g++ -dumpmachine

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"

          arm-linux-gnueabihf-gcc -dumpmachine
          arm-linux-gnueabihf-g++ -dumpmachine

          echo
          echo "========================================"
          echo "ARM FLAGS"
          echo "========================================"

          echo | arm-linux-gnueabihf-gcc \
            -march=armv6 \
            -marm \
            -mfpu=vfp \
            -mfloat-abi=hard \
            -dM -E - | \
            grep -E '(__arm__|__ARM_ARCH|__ARM_PCS_VFP)'

          echo
          echo "========================================"
          echo "TEST ARM C"
          echo "========================================"

          cat > /tmp/test.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          arm-linux-gnueabihf-gcc \
            -march=armv6 \
            -marm \
            -mfpu=vfp \
            -mfloat-abi=hard \
            /tmp/test.c \
            -o /tmp/test-arm

          echo
          echo "Generated ARM executable:"
          file /tmp/test-arm

      # ----------------------------------------------------------
      # Configure openMSX
      # ----------------------------------------------------------
      - name: Configure ARM
        run: |
          ./configure

      # ----------------------------------------------------------
      # Show openMSX configuration
      # ----------------------------------------------------------
      - name: Show openMSX configuration
        run: |
          make -f build/main.mk config

      # ----------------------------------------------------------
      # Show relevant compiler variables
      # ----------------------------------------------------------
      - name: Show build environment
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "OPENMSX_TARGET_CPU=$OPENMSX_TARGET_CPU"
          echo "OPENMSX_TARGET_OS=$OPENMSX_TARGET_OS"
          echo "OPENMSX_FLAVOUR=$OPENMSX_FLAVOUR"

      # ----------------------------------------------------------
      # Clean
      # ----------------------------------------------------------
      - name: Clean previous 3rdparty build
        run: |
          rm -rf derived/arm-linux-opt-3rd/3rdparty

      # ----------------------------------------------------------
      # Build 3rd party libraries
      # ----------------------------------------------------------
      - name: Build 3rd party libraries
        run: |
          make -f build/main.mk 3rdparty \
            OPENMSX_TARGET_CPU=arm \
            OPENMSX_TARGET_OS=linux \
            OPENMSX_FLAVOUR=opt \
            PYTHON=python3

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build static ARM distribution
        shell: bash
        run: |
          set -e

          export LIBRARY_PATH="/usr/lib/arm-linux-gnueabihf:/usr/lib/gcc-cross/arm-linux-gnueabihf/13"
          export LDFLAGS="-L/usr/lib/arm-linux-gnueabihf"
          
          echo "===== glew.c linhas 45-65 ====="
          sed -n '45,65p' derived/3rdparty/src/glew-2.2.0/src/glew.c
          
          echo "===== glxew.h linhas 85-105 ====="
          sed -n '85,105p' derived/3rdparty/src/glew-2.2.0/include/GL/glxew.h
          
          make V=1 -j8 staticbindist \
            CC=arm-linux-gnueabihf-gcc \
            CXX=arm-linux-gnueabihf-g++ \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"

      # ----------------------------------------------------------
      # Show generated files
      # ----------------------------------------------------------
      - name: Find generated files
        run: |
          echo "Generated files:"
          find derived -type f -maxdepth 6 -print | sort

      # ----------------------------------------------------------
      # Verify ARM architecture
      # ----------------------------------------------------------
      - name: Verify ARM architecture
        run: |
          echo "ARM executables:"
          find derived -type f -executable -exec file {} \;

      # ----------------------------------------------------------
      # Upload ARM distribution
      # ----------------------------------------------------------
      - name: Upload openMSX ARM
        uses: actions/upload-artifact@v4
        with:
          name: openMSX-msx2pp-linux-armhf
          path: |
            derived/arm-linux-opt-3rd/bindist/**
          if-no-files-found: error
